    - paper_result: "Theorem 1.4(i), limit c/2 along odd n"
      lean_name: "Erdos361.Statement.erdos361_odd_limit"
      status: "proved, axiom-free"
    - paper_result: "Theorem 1.4(ii), q = 3, 0 < c ≤ 1/2"
      lean_name: "Erdos361.Statement.erdos361_mod6_limit_low"
      status: "proved, axiom-free"
    - paper_result: "Theorem 1.4(ii), q = 3, 1/2 < c < 1"
      lean_name: "Erdos361.Statement.erdos361_mod6_limit_high"
      status: "proved, axiom-free"
    - paper_result: "Corollary 1.5 for q ∈ {2,3}"
      lean_name: "Erdos361.Statement.erdos361_two_limit_points"
      status: "proved, axiom-free"
    - paper_result: "Theorem 1.2, q = 2"
      lean_name: "Erdos361.Statement.inverse_s1"
      status: "proved, axiom-free"
    - paper_result: "Theorem 1.2, q = 3"
      lean_name: "Erdos361.Statement.inverse_s2"
      status: "proved, axiom-free"
    - paper_result: "Theorem 1.2, s = 2, 2E < sT < 3E, 3 ∤ sT"
      lean_name: "Erdos361.Statement.inverse_s2_restricted"
      status: "proved, axiom-free"

